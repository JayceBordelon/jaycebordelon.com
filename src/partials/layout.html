<!doctype html>
<html lang="en" class="{{ htmlClass }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#fafafa" />
    <title>{{ title }}</title>
    <meta name="description" content="{{ description }}" />
    <link rel="canonical" href="{{ canonical }}" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta property="og:type" content="{{ ogType }}" />
    <meta property="og:title" content="{{ ogTitle }}" />
    <meta property="og:description" content="{{ description }}" />
    <meta property="og:url" content="{{ canonical }}" />
    <meta property="og:site_name" content="Jayce Bordelon" />
    <meta property="og:image" content="{{ ogImage }}" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{ ogTitle }}" />
    <meta name="twitter:description" content="{{ description }}" />
    <meta name="twitter:image" content="{{ ogImage }}" />
    <meta name="twitter:creator" content="@JayceBordelon" />

    <link rel="preload" href="/fonts/barlow-condensed-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/dm-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/dm-sans-latin-wght-italic.woff2" as="font" type="font/woff2" crossorigin />

    <link rel="stylesheet" href="/styles.css" />

    <script type="application/ld+json">
      {{ jsonLd }}
    </script>
  </head>
  <body class="{{ bodyClass }}">
    <a class="skip-link" href="#main">Skip to content</a>
    <main id="main" class="site-main" tabindex="-1">{{ content }}</main>
    {{ pageScripts }}
  </body>
</html>
