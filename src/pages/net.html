<!-- The listening machine's own page. The canvas fills the viewport
     behind the header, neural.js spawns the net on load, ambience.js
     owns the audio through the transport bar, and BACK TO HOME (or
     Escape) collapses the machine before navigating away. -->
<div class="net-stage" aria-hidden="true">
  <canvas id="bg-net"></canvas>
</div>
<div id="listen-bar" class="listen-bar">
  <button type="button" id="listen-play" class="listen-play">PAUSE</button>
  <span id="listen-time" class="listen-clock">0:00</span>
  <input id="listen-seek" class="listen-seek" type="range" min="0" max="1000" step="1" value="0" aria-label="Seek through the track" />
  <span id="listen-dur" class="listen-clock">0:00</span>
  <select id="listen-track" class="listen-track" aria-label="Choose a song"></select>
  <a id="listen-exit" class="listen-exit" href="/">BACK TO HOME</a>
</div>
<audio id="ambience-track" src="/audio/first-dance.m4a" autoplay preload="auto"></audio>
